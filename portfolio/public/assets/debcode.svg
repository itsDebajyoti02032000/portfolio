<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7c948;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg)"/>

  <!-- Terminal window chrome -->
  <rect x="24" y="20" width="752" height="36" rx="8" ry="8" fill="#16162a"/>
  <circle cx="48" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="68" cy="38" r="6" fill="#febc2e"/>
  <circle cx="88" cy="38" r="6" fill="#28c840"/>
  <text x="400" y="43" text-anchor="middle" fill="#8888aa" font-family="monospace" font-size="13">debcode ~ /your-project</text>

  <!-- Terminal body -->
  <rect x="24" y="56" width="752" height="424" rx="0" ry="0" fill="#0d0d1a" rx="0 0 8 8"/>
  <rect x="24" y="468" width="752" height="12" rx="0" ry="0" fill="#0d0d1a"/>
  <rect x="24" y="472" width="752" height="8" rx="0 0 8 8" fill="#0d0d1a"/>

  <!-- Prompt line -->
  <text x="44" y="88" fill="#f7c948" font-family="monospace" font-size="14" font-weight="bold">$</text>
  <text x="60" y="88" fill="#e0e0e0" font-family="monospace" font-size="14">debcode</text>

  <!-- Logo / Brand -->
  <text x="44" y="120" fill="#ff6b35" font-family="monospace" font-size="14" font-weight="bold">DebCode</text>
  <text x="130" y="120" fill="#6b7280" font-family="monospace" font-size="14">v1.0 - Autonomous Coding Harness</text>

  <!-- Separator -->
  <line x1="44" y1="132" x2="756" y2="132" stroke="#2a2a4a" stroke-width="1"/>

  <!-- User prompt -->
  <text x="44" y="158" fill="#50fa7b" font-family="monospace" font-size="13">&gt;</text>
  <text x="62" y="158" fill="#e0e0e0" font-family="monospace" font-size="13">Add input validation to the login endpoint</text>

  <!-- Plan section -->
  <text x="44" y="190" fill="#8be9fd" font-family="monospace" font-size="13" font-weight="bold">Plan:</text>
  <text x="62" y="212" fill="#9ca3af" font-family="monospace" font-size="12">1. Read the login route</text>
  <text x="62" y="232" fill="#9ca3af" font-family="monospace" font-size="12">2. Add validation logic</text>
  <text x="62" y="252" fill="#9ca3af" font-family="monospace" font-size="12">3. Update tests</text>
  <text x="62" y="272" fill="#9ca3af" font-family="monospace" font-size="12">4. Run tests and verify</text>

  <!-- Tool calls -->
  <text x="62" y="304" fill="#f7c948" font-family="monospace" font-size="12">&#9656; search_code</text>
  <text x="210" y="304" fill="#6b7280" font-family="monospace" font-size="12">(pattern="def login")</text>
  <text x="62" y="324" fill="#50fa7b" font-family="monospace" font-size="12">&#10003; Found 2 matches</text>

  <text x="62" y="350" fill="#f7c948" font-family="monospace" font-size="12">&#9656; read_file</text>
  <text x="186" y="350" fill="#6b7280" font-family="monospace" font-size="12">(path="src/auth/routes.py")</text>
  <text x="62" y="370" fill="#50fa7b" font-family="monospace" font-size="12">&#10003; Read 85 lines</text>

  <text x="62" y="396" fill="#f7c948" font-family="monospace" font-size="12">&#9656; edit_file</text>
  <text x="186" y="396" fill="#6b7280" font-family="monospace" font-size="12">(path="src/auth/routes.py", ...)</text>
  <text x="62" y="416" fill="#50fa7b" font-family="monospace" font-size="12">&#10003; Edited</text>

  <text x="62" y="442" fill="#f7c948" font-family="monospace" font-size="12">&#9656; run_command</text>
  <text x="210" y="442" fill="#6b7280" font-family="monospace" font-size="12">(command="pytest")</text>
  <text x="62" y="462" fill="#50fa7b" font-family="monospace" font-size="12">&#10003; Exit code: 0 &#8212; All tests passed</text>
</svg>
